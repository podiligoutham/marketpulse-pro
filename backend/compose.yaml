services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: marketpulse
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: marketpulse_dev
    ports:
      - "5432:5432"
    volumes:
      - marketpulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  marketpulse_postgres_data:
