spring:
  application:
    name: marketpulse-backend
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/marketpulse}
    username: ${DB_USERNAME:marketpulse}
    password: ${DB_PASSWORD:marketpulse_dev}
  flyway:
    enabled: true
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/marketpulse}
    user: ${DB_USERNAME:marketpulse}
    password: ${DB_PASSWORD:marketpulse_dev}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO
    com.marketpulse: DEBUG
    org.springframework.web: INFO
    reactor.netty: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
finnhub:
  base-url: https://finnhub.io/api/v1
  api-key: ${FINNHUB_API_KEY}
  timeout: 5s
